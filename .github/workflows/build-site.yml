# Régénère le site (dossier docs/) à chaque modification du contenu, que celle-ci vienne
# du back-office (/admin/) ou d'un commit classique. GitHub Pages publie ensuite docs/.
name: Générer le site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "site_src/**"
      - "build.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la dernière version de main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le site et vérifier les liens
        run: python build.py

      - name: Enregistrer le site généré
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Le site généré est déjà à jour."
            exit 0
          fi
          git commit -m "Régénérer le site (${GITHUB_SHA::7})"
          # Si main a évolué pendant la génération, l'exécution suivante (déjà en file
          # d'attente) régénérera le site à partir de la dernière version.
          git push || echo "main a évolué pendant la génération : la prochaine exécution s'en charge."
